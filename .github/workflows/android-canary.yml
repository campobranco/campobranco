name: Build Android (Canary)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build_android_apk_canary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js (Export)
        run: |
          rm -f .env.production
          npm run build
        env:
          NEXT_PUBLIC_APP_NAME: ${{ vars.CAPACITOR_APP_NAME_DEV }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL_DEV }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID_DEV }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY_DEV }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN_DEV }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET_DEV }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID_DEV }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_DEV }}
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_ID_DEV }}

      - name: Sync Capacitor for Canary (Dev)
        run: npx cap sync android
        env:
          CAPACITOR_APP_ID: ${{ vars.CAPACITOR_APP_ID_DEV }}
          CAPACITOR_APP_NAME: ${{ vars.CAPACITOR_APP_NAME_DEV }}

      - name: Inject Google Services JSON
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_DEV_B64 }}" | base64 --decode > android/app/google-services.json

      - name: Sync version and name to Android
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          VERSION_CODE=${{ github.run_number }}
          APP_NAME="${{ vars.CAPACITOR_APP_NAME_DEV }}"
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/<string name=\"app_name\">.*/<string name=\"app_name\">$APP_NAME<\/string>/" android/app/src/main/res/values/strings.xml
          sed -i "s/<string name=\"title_activity_main\">.*/<string name=\"title_activity_main\">$APP_NAME<\/string>/" android/app/src/main/res/values/strings.xml

      - name: Inject Canary Icons
        run: |
          cp public/app-icon-c.png assets/icon.png || true
          cp public/app-icon-c.png public/app-icon.png || true
          cp public/icon-512x512-c.png public/icon-512x512.png || true
          cp public/icon-192x192-c.png public/icon-192x192.png || true
          cp public/apple-touch-icon-c.png public/apple-touch-icon.png || true
          npx @capacitor/assets generate --android

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampoBranco-Canary-v${{ env.VERSION_NAME }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Setup F-Droid Repo (Dev)
        run: |
          sudo add-apt-repository -y ppa:fdroid/fdroidserver
          sudo apt-get update
          sudo apt-get install -y fdroidserver
          sudo sed -i 's/raise ResParserError("res1 must be zero!")/pass/g' /usr/lib/python3/dist-packages/androguard/core/bytecodes/axml/__init__.py
          mkdir -p fdroid/repo
          cp android/app/build/outputs/apk/debug/app-debug.apk fdroid/repo/CampoBrancoCanary.apk
          cp public/icon-512x512.png fdroid/icon.png
          cd fdroid
          echo "${{ secrets.FDROID_KEYSTORE_DEV_B64 }}" | base64 --decode > keystore.p12
          echo "repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo-dev/repo" > config.yml
          echo "repo_name: ${{ vars.CAPACITOR_REPO_NAME_DEV }}" >> config.yml
          echo "repo_description: Campo Branco Dev Repository" >> config.yml
          echo "repo_icon: icon.png" >> config.yml
          echo "keystore: keystore.p12" >> config.yml
          echo "repo_keyalias: fdroid" >> config.yml
          echo "keystorepass: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}" >> config.yml
          echo "keypass: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}" >> config.yml
          chmod 600 config.yml
          fdroid update -c

      - name: Deploy F-Droid Repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          destination_dir: repo-dev/repo
          keep_files: true
