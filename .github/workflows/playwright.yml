name: Playwright Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm install

      - name: Check Internal API Contracts
        run: npm run contracts:check

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npx playwright install --with-deps

      - name: Run Integration Suite with Firebase Emulator
        run: npx firebase emulators:exec --only firestore,auth --project demo-test "npm run seed:integration && npm run test:integration && npm run test:e2e"
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
