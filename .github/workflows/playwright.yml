name: Playwright Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Check Internal API Contracts
        run: npm run contracts:check

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npx playwright install --with-deps

      - name: Run Integration Suite with Firebase Emulator
        run: npx firebase emulators:exec --only firestore,auth --project demo-test "npm run seed:integration && npm run test:integration && npm run test:e2e"
