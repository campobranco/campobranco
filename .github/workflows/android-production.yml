name: Build Android (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js (Export)
        run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL_PROD }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID_PROD }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY_PROD }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN_PROD }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET_PROD }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID_PROD }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_PROD }}
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_ID_PROD }}

      - name: Sync Capacitor for Production
        run: npx cap sync android
        env:
          CAPACITOR_APP_ID: ${{ vars.CAPACITOR_APP_ID_PROD }}
          CAPACITOR_APP_NAME: ${{ vars.CAPACITOR_APP_NAME_PROD }}

      - name: Inject Google Services JSON
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_PROD_B64 }}" | base64 --decode > android/app/google-services.json

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampoBranco-Production-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Setup F-Droid Repo
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver python3-pip
          sudo pip3 install --upgrade androguard --break-system-packages
          mkdir -p fdroid/repo
          cp android/app/build/outputs/apk/debug/app-debug.apk fdroid/repo/CampoBranco.apk
          cd fdroid
          echo "${{ secrets.FDROID_KEYSTORE_PROD_B64 }}" | base64 --decode > keystore.p12
          echo "repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo" > config.yml
          echo "repo_name: Campo Branco" >> config.yml
          echo "repo_description: Campo Branco Official Repository" >> config.yml
          echo "keystore: keystore.p12" >> config.yml
          echo "repo_keyalias: fdroid" >> config.yml
          echo "keystorepass: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}" >> config.yml
          echo "keypass: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}" >> config.yml
          chmod 600 config.yml
          fdroid update -c

      - name: Deploy F-Droid Repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          destination_dir: repo
          keep_files: true
